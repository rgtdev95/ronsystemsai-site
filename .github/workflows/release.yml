name: Release

# A release is a version tag on main. After merging dev into main:
#   git switch main && git pull
#   git tag v1.2.0 && git push origin v1.2.0
# This runs the CI checks, pushes the image to ghcr.io/<owner>/<repo>:v1.2.0 (and :latest)
# and creates the GitHub release. Nothing touches the server: deploying is manual,
# with docker/deploy.sh (see docs/09-architecture-and-deployment.md).
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push the image
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to check that the tag is on main

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$VERSION isn't on main. Merge dev into main first, then tag main."
            exit 1
          }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build -f docker/Dockerfile \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Image:** \`$IMAGE:$VERSION\`"
            echo
            echo "**Deploy** on the server (the same command with an older version rolls back):"
            echo
            echo '```'
            echo "cd ~/ronsystemsai/docker && ./deploy.sh $VERSION"
            echo '```'
            echo
          } > notes.md
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md --generate-notes
