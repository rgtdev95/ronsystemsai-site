name: Deploy

# main -> ronsystemsai.com. The only environment for now; `develop` just runs CI on pull requests.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests wsgi.py
      - run: pytest -q

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,IMAGE
          script: |
            cd ~/ronsystemsai/deploy
            export IMAGE IMAGE_TAG="$TAG"
            docker compose pull web
            docker compose up -d --remove-orphans
            docker image prune -f
            # IndexNow: ask Bing (and other engines) to recrawl every page in the sitemap.
            # The key lives in .env; the site serves it at /<key>.txt to prove ownership.
            KEY=$(grep '^INDEXNOW_KEY=' .env | cut -d= -f2- | tr -d '"\r')
            if [ -n "$KEY" ]; then
              URLS=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://ronsystemsai.com/sitemap.xml \
                | grep -o '<loc>[^<]*' | sed 's/<loc>/"/; s/$/"/' | paste -sd, -)
              curl -fsS -H 'Content-Type: application/json; charset=utf-8' \
                -d "{\"host\":\"ronsystemsai.com\",\"key\":\"$KEY\",\"urlList\":[$URLS]}" \
                https://api.indexnow.org/indexnow || echo "IndexNow ping failed (not fatal)"
            fi
