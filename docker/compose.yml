# The website on the VPS. Only this container lives here: the VPS's shared Caddy serves
# ronsystemsai.com and www and reaches it by container name over the shared `proxy` network, and
# the site's analytics use the VPS's shared Umami at stats.ronsystemsai.com (decision 21). Both are
# set up in the VPS configuration repo (Caddyfile and docker-apps/external/ronsystemsai).
# Settings come from `.env` next to this file: the same file as the project's .env.
#
# /opt/apps/website on the server is a root-owned clone of the repo. Deploy or roll back with:
#   cd /opt/apps/website/docker && sudo ./deploy.sh v1.2.0
# The release's version is kept in .env (IMAGE_TAG), so plain `sudo docker compose ...` commands
# keep running that same version.

# Fixed name, so the project's name doesn't depend on the folder this file sits in.
name: ronsystemsai

services:
  web:
    image: ${IMAGE:-ghcr.io/rgtdev95/ronsystemsai-site}:${IMAGE_TAG:-latest}
    # Named after the VPS convention (<app>-<scope>-<server>), with no domain in it: the VPS repo keeps
    # the real domain out of its committed files, and its Caddyfile uses this name.
    container_name: website-ext-ovhvps1
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production   # also sets SITE_URL=https://ronsystemsai.com and turns on Umami
    read_only: true
    tmpfs: [/tmp]
    networks: [proxy]

networks:
  # Created by the VPS's Caddy. Start Caddy first.
  proxy:
    external: true
